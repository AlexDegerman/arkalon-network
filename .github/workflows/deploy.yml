name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: network-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Preserve server-managed files (.env) during sync
      - name: Deploy source code to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: '.,!node_modules,!.next,!.git,!.env*,!*.log,!.github,!.vscode'
          target: /opt/arkalon/arkalon-network/
          overwrite: true
          rm: false

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/arkalon/arkalon-network
            
            export DEPLOY_SHA="${{ steps.sha.outputs.short }}"
            
            echo "Building image with tags: latest and ${DEPLOY_SHA}"
            docker build -t "arkalon-network:latest" -t "arkalon-network:${DEPLOY_SHA}" .
            
            echo "Stopping and removing old container..."
            docker stop arkalon-network || true
            docker rm arkalon-network || true
            
            echo "Starting new container..."
            docker run -d \
              --name arkalon-network \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file .env \
              arkalon-network:latest
            
            echo "Waiting 10s for Next.js healthcheck..."
            sleep 10
            
            echo "Running healthcheck..."
            docker exec arkalon-network node -e "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            
            echo "Cleaning up unused docker images..."
            docker image prune -f
            
            echo "Deployment of ${DEPLOY_SHA} complete and healthy!"